<script>
// var COLOURS = ["08","09","0a","0b","0c","0d","0e","0f"];
// var THEME_HEX = {
//   "08": "#ac4142",
//   "09": "#d28445",
//   "0a": "#f4bf75",
//   "0b": "#90a959",
//   "0c": "#75b5aa",
//   "0d": "#6a9fb5",
//   "0e": "#aa759f",
//   "0f": "#8f5536"
// };
var COLOURS = [
    "#ac4142",
    "#d28445",
    "#f4bf75",
    "#90a959",
    "#75b5aa",
    "#6a9fb5",
    "#aa759f",
    "#8f5536",
    "#586ba4",
    "#324376",
    "#f68e5f",
    "#f76c5e",
    "#14342b",
    "#60935d",
    "#ff579f",
    "#330C2F",
    "#37323E",
    "#6D6A75",
    "#2A2D34",
    "#09814A"
]

var ROTATE_INTERVAL = 1000 * 70;

var TRANSITION_DURATION = 1000 * 55;

// Deterministic pseudo-random value in [0,1) for a given integer seed, so
// every page load/tab computes the identical value for the same epoch.
function seededRandom(seed) {
  var x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function permutationForRound(round) {
  var perm = COLOURS.slice();
  for (var i = perm.length - 1; i > 0; i--) {
    var j = Math.floor(seededRandom(round * 1000 + i) * (i + 1));
    var tmp = perm[i];
    perm[i] = perm[j];
    perm[j] = tmp;
  }
  return perm;
}

function correctedPermutationForRound(round) {
  var perm = permutationForRound(round);
  // Every entry in a shuffle is unique, so perm[1] is guaranteed not to be
  // the previous round's last colour too.
  var prevLast = permutationForRound(round - 1)[COLOURS.length - 1];
  if (perm[0] === prevLast) {
    var tmp = perm[0];
    perm[0] = perm[1];
    perm[1] = tmp;
  }
  return perm;
}

function colourForEpoch(epoch) {
  var round = Math.floor(epoch / COLOURS.length);
  var pos = epoch % COLOURS.length;
  return correctedPermutationForRound(round)[pos];
}

function currentEpoch() {
  return Math.floor(Date.now() / ROTATE_INTERVAL);
}

// HACK, Firefox-only bug workaround: this whole business of reaching into
// the stylesheet and rewriting the @keyframes rule by hand only exists
// because Firefox (confirmed on 152, whatever's current as of 2026-07)
// won't smoothly animate a registered custom property (@property) when its
// keyframe values are themselves indirected through var(). Concretely:
//
//   @keyframes theme-cycle {
//     from { --theme-color: var(--theme-color-from, #fff); }
//     to   { --theme-color: var(--theme-color-to, #fff); }
//   }
//
// with --theme-color-from/-to set via body.style.setProperty(...) - is the
// natural, obvious way to write this, and it works perfectly in Chrome: the
// colour eases smoothly across the animation's duration. In Firefox it
// doesn't ease at all - it holds --theme-color at the "from" value, then
// snaps straight to "to" partway through (right around where the `ease`
// timing function crosses 50% progress), i.e. Firefox is falling back to
// discrete/non-interpolated animation instead of treating the var()
// indirection as resolving to an animatable <color>. Verified this isn't an
// inheritance thing either - even sampled directly on <body>, same snap.
//
// The fix that actually works in Firefox is to skip the indirection
// entirely and write literal colours straight into the @keyframes rule
// before every restart, which is what findThemeCycleKeyframesRule() and the
// loop in startTransition() below do.
//
// If Firefox ever fixes this (i.e. var()-indirected keyframe values on a
// registered custom property animate smoothly, matching Chrome), this can
// all be deleted and replaced with the simpler version above: set
// --theme-color-from/-to as ordinary custom properties on body in
// startTransition(), reference them via var() in the @keyframes rule in
// hyde.css, and drop findThemeCycleKeyframesRule() and the CSSOM-mutation
// loop entirely.
var themeCycleKeyframesRule = null;
function findThemeCycleKeyframesRule() {
  if (themeCycleKeyframesRule) return themeCycleKeyframesRule;
  for (var i = 0; i < document.styleSheets.length; i++) {
    var rules;
    try {
      rules = document.styleSheets[i].cssRules;
    } catch (e) {
      continue;
    }
    if (!rules) continue;
    for (var j = 0; j < rules.length; j++) {
      if (rules[j] instanceof CSSKeyframesRule && rules[j].name === "theme-cycle") {
        themeCycleKeyframesRule = rules[j];
        return themeCycleKeyframesRule;
      }
    }
  }
  return null;
}

function startTransition(fromColour, toColour, delayMs) {
  var body = document.querySelector("body");
  var fadeIn = body.classList.contains("theme-fade-in");
  // theme-base-XX used to be a base16 code (eg. "08"); now that COLOURS is
  // just hex values, the label is the hex digits themselves instead.
  body.className = "layout-reverse theme-base-" + toColour.slice(1) + (fadeIn ? " theme-fade-in" : "");
  var keyframesRule = findThemeCycleKeyframesRule();
  for (var i = 0; i < keyframesRule.cssRules.length; i++) {
    var keyframe = keyframesRule.cssRules[i];
    if (keyframe.keyText === "0%") keyframe.style.setProperty("--theme-color", fromColour);
    if (keyframe.keyText === "100%") keyframe.style.setProperty("--theme-color", toColour);
  }
  body.style.setProperty("--theme-anim-duration", TRANSITION_DURATION + "ms");
  body.style.setProperty("--theme-anim-delay", delayMs + "ms");
  // Restarting animation-name (rather than the whole shorthand) forces the
  // browser to re-read the delay/duration/colours we just set.
  body.style.animationName = "none";
  body.offsetHeight;
  body.style.animationName = "";
}

// On a fresh load, seek straight to wherever a page that had been open the
// whole time would currently be, instead of always starting a fresh 70s
// wait followed by a fresh 55s transition.
function applyInitialColour() {

  var epoch = currentEpoch();
  var elapsed = Date.now() - epoch * ROTATE_INTERVAL;
  startTransition(colourForEpoch(epoch - 1), colourForEpoch(epoch), -elapsed);
}

// Line the recurring rotation up on the same wall-clock boundaries for
// every visitor, rather than starting a fresh 70s timer from load time.
function scheduleRotation() {
  var msToNextEpoch = (currentEpoch() + 1) * ROTATE_INTERVAL - Date.now();
  setTimeout(function rotate() {
    var epoch = currentEpoch();
    startTransition(colourForEpoch(epoch - 1), colourForEpoch(epoch), 0);
    setInterval(rotate, ROTATE_INTERVAL);
  }, msToNextEpoch);
}

applyInitialColour();
scheduleRotation();

{{ if hugo.IsServer }}
// Dev-server only: Hugo's LiveReload hot-swaps just the <link
// rel="stylesheet"> tag on CSS-only changes, without reloading the page or
// re-running this script. The freshly-swapped-in stylesheet's @keyframes
// theme-cycle rule starts back at its literal #fff placeholders (see the
// comment above findThemeCycleKeyframesRule), so --theme-color goes white
// until something repopulates them. Watch for stylesheet swaps and redo
// that work each time one lands, instead of waiting for a real navigation.
var styleSwapObserver = new MutationObserver(function (mutations) {
  mutations.forEach(function (mutation) {
    mutation.addedNodes.forEach(function (node) {
      if (node.tagName === "LINK" && node.rel === "stylesheet") {
        node.addEventListener("load", function () {
          // Reach into this specific, just-loaded stylesheet rather than
          // re-running the generic document.styleSheets search: LiveReload
          // keeps the old <link> (and its stylesheet) in the document for a
          // moment after the new one's `load` fires, only removing it
          // slightly later, so a generic search would still find the old,
          // about-to-be-removed rule instead of the new one.
          var rules = node.sheet && node.sheet.cssRules;
          if (!rules) return;
          for (var i = 0; i < rules.length; i++) {
            if (rules[i] instanceof CSSKeyframesRule && rules[i].name === "theme-cycle") {
              themeCycleKeyframesRule = rules[i];
              applyInitialColour();
              break;
            }
          }
        });
      }
    });
  });
});
styleSwapObserver.observe(document.head, { childList: true });
{{ end }}
</script>
