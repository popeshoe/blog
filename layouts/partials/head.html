<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-RZ5CZGXNH6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-RZ5CZGXNH6');
  </script>
  
  <link href="http://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  {{ hugo.Generator }}

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &middot; {{ .Site.Title }}{{ end }}</title>

  <!-- Must run before the stylesheet and stay inline: an external file would
       race first paint and flash the wrong scheme. No stored value = follow OS. -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) { /* private mode / storage disabled - fall back to the OS */ }
  </script>

  <!-- Fingerprinted, so the filename changes only when the contents do.
       RelPermalink is root-relative and canonifyURLs is off (see hugo.json), so
       this stays same-origin on any host - which colours.html needs in order to
       read its @keyframes rule out of the sheet. No SRI: the asset is
       self-hosted and same-origin, so anyone able to alter it could equally
       rewrite the hash here. -->
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abel&display=swap">

  <!-- Icons -->
  <link rel="shortcut icon" href="/favicon.ico">

  <!-- RSS -->
  <link href='{{ with .OutputFormats.Get "RSS" }}{{ .RelPermalink }}{{ end }}' rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" />

<script>
document.addEventListener("DOMContentLoaded", function(event) {
  var leads = [
    "Semioccasional scientist, incessant procrastinator, frequent eater",
    "Imagine terrible memes, but a human",
    "Kind of like Skeletor, but fat",
    "Once startled by the shadow of a girl on a bike",
    "Watched every single episode of The West Wing at least 3 times",
    "Sponsored by Tesco Metro",
    "Prefers Pepsi Max!",
    "Easily convinced of bullshit",
    "Probably listening to a podcast right now",
    "Getting worse at videogames every day",
    "Too proud of the stupid colours on this page",
    "is scared of AI",
    "Hell yeah!",
    "🦆🦆🦆🦆🦆🦆🦀",
    "is a physicalist according to DeekSeek",
    "now with ADHD"
  ];
  document.querySelector(".sidebar .lead").textContent = leads[Math.floor(Math.random() * leads.length)];
});

</script>
</head>
