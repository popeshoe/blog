<script>
(function () {
  // The whole theme engine. main.css holds a 1400s @keyframes rule walking all
  // 20 colours; this only points it at where wall-clock says the loop should
  // be, so every visitor sits on the same colour at the same moment.
  var CYCLE_MS = 1400000;
  var body = document.body;

  function animation() {
    if (!body.getAnimations) return null;
    var running = body.getAnimations();
    for (var i = 0; i < running.length; i++) {
      if (running[i].animationName === "theme-cycle") return running[i];
    }
    return null;
  }

  // Restarting re-resolves the light-dark() pairs in the keyframes against the
  // current color-scheme. Chromium gets there on its own a few frames after a
  // scheme change; this is insurance for engines that might not, since the
  // failure mode is a theme toggle that silently stops changing the accent.
  // It also makes the no-getAnimations fallback's negative delay absolute,
  // because the start time becomes now.
  function apply() {
    body.style.animation = "none";
    body.offsetHeight;
    body.style.animation = "";

    var position = Date.now() % CYCLE_MS;
    var anim = animation();
    // currentTime, not animation-delay: delay is measured from the animation's
    // own start time, so it drifts by however long the page has been open.
    if (anim) anim.currentTime = position;
    else body.style.animationDelay = -position + "ms";
  }

  apply();

  new MutationObserver(apply).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-theme"] });

  var os = matchMedia("(prefers-color-scheme: dark)");
  if (os.addEventListener) os.addEventListener("change", apply);
})();
</script>
